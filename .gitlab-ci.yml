stages:
  - build

build-kernel:
  stage: build
  image: ghcr.io/kiemlicz/util/kernel-builder:v0.0.2-kb
  tags:
    - amd64
  variables:
    KUBERNETES_NODE_SELECTOR_HOSTNAME: "kubernetes.io/hostname=i5-13600k-debian"
    KERNEL: kernel8
    ARCH: arm64
    CROSS_COMPILE: aarch64-linux-gnu-
    KERNEL_BRANCH: rpi-6.18.y
    DEFCONFIG: bcm2712_defconfig
  script:
    - ./scripts/build-kernel-btf.sh
    - |
      for d in *.deb; do
        curl --request PUT --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$d" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/debian/$d?distribution=trixie&component=main&architecture=arm64"
      done
