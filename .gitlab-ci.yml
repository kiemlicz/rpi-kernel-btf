stages:
  - build

build-kernel:
  stage: build
  image: ghcr.io/kiemlicz/util/kernel-builder:v0.0.1-kb.1
  variables:
    KUBERNETES_NODE_SELECTOR_HOSTNAME: "kubernetes.io/hostname=i5-13600k-debian"
    KERNEL: kernel8
    ARCH: arm64
    CROSS_COMPILE: aarch64-linux-gnu-
  before_script:
    - git clone --depth=1 https://github.com/raspberrypi/linux.git
    - cd linux
  script:
    # Use bcm2711_defconfig for Pi 4, or bcm2712_defconfig for Pi 5
    - make bcm2711_defconfig
    # Enable BTF debug info
    - ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
    # Ensure BPF syscalls are enabled (usually default on RPi, but good to be safe)
    - ./scripts/config --enable CONFIG_BPF_SYSCALL
    # Apply the changes and automatically answer 'yes' to any new dependency prompts
    - make olddefconfig
    - make -j$(nproc) bindeb-pkg KDEB_PKGVERSION=1.0-custom-btf
  artifacts:
    paths:
      - "*.deb"
